name: verificacion

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y probar
        run: mvn -B verify
