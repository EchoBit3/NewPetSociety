<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#111827">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="#FFFFFF"/>

  <rect x="35" y="16" width="150" height="40" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="110" y="41" text-anchor="middle" font-size="12">Petición validada</text>
  <line x1="110" y1="56" x2="110" y2="500" stroke="#111827" stroke-dasharray="4 4"/>

  <rect x="235" y="16" width="150" height="40" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="310" y="41" text-anchor="middle" font-size="12">Cargar partida</text>
  <line x1="310" y1="56" x2="310" y2="500" stroke="#111827" stroke-dasharray="4 4"/>

  <rect x="435" y="16" width="150" height="40" rx="8" fill="#E6F4EA" stroke="#111827"/>
  <text x="510" y="41" text-anchor="middle" font-size="12">Caché de partidas</text>
  <line x1="510" y1="56" x2="510" y2="500" stroke="#111827" stroke-dasharray="4 4"/>

  <rect x="635" y="16" width="150" height="40" rx="8" fill="#E6F4EA" stroke="#111827"/>
  <text x="710" y="41" text-anchor="middle" font-size="12">Partida guardada</text>
  <line x1="710" y1="56" x2="710" y2="500" stroke="#111827" stroke-dasharray="4 4"/>

  <rect x="835" y="16" width="150" height="40" rx="8" fill="#E6F4EA" stroke="#111827"/>
  <text x="910" y="41" text-anchor="middle" font-size="12">Mascota</text>
  <line x1="910" y1="56" x2="910" y2="500" stroke="#111827" stroke-dasharray="4 4"/>

  <line x1="110" y1="110" x2="310" y2="110" stroke="#111827" marker-end="url(#a)"/>
  <text x="116" y="103" font-size="11">Pide la partida de la cuenta</text>

  <line x1="310" y1="145" x2="510" y2="145" stroke="#111827" marker-end="url(#a)"/>
  <text x="316" y="138" font-size="11">Busca la partida activa</text>

  <path d="M510,175 H570 V205 H510" fill="none" stroke="#111827" marker-end="url(#a)"/>
  <text x="576" y="195" font-size="11">Revisa la memoria</text>

  <line x1="510" y1="235" x2="310" y2="235" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="316" y="228" font-size="11">Sin copia en memoria</text>

  <line x1="310" y1="265" x2="710" y2="265" stroke="#111827" marker-end="url(#a)"/>
  <text x="316" y="258" font-size="11">Lee el ultimo guardado</text>

  <line x1="710" y1="295" x2="310" y2="295" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="316" y="288" font-size="11">Estado crudo con su fecha</text>

  <line x1="310" y1="325" x2="910" y2="325" stroke="#111827" marker-end="url(#a)"/>
  <text x="316" y="318" font-size="11">Aplica el tiempo transcurrido</text>

  <line x1="910" y1="355" x2="310" y2="355" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="316" y="348" font-size="11">Cuidado, inventario y moneda</text>

  <line x1="310" y1="385" x2="510" y2="385" stroke="#111827" marker-end="url(#a)"/>
  <text x="316" y="378" font-size="11">Deja la partida en memoria</text>

  <line x1="310" y1="415" x2="110" y2="415" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="116" y="408" font-size="11">Estado completo de una vez</text>
</svg>
