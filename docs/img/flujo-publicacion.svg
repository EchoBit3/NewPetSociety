  <text x="500" y="277" font-size="11">Anuncio del parche</text>

  <path d="M690,320 H760 V355 H690" fill="none" stroke="#111827" marker-end="url(#a)"/>
  <text x="660" y="342" text-anchor="end" font-size="11">Actualiza y juega</text>
