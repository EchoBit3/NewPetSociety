<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#111827">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#FFFFFF"/>

  <rect x="40" y="30" width="240" height="54" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="160" y="52" text-anchor="middle">Fase 0</text>
  <text x="160" y="70" text-anchor="middle" font-size="11">documentación</text>

  <rect x="40" y="120" width="240" height="54" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="160" y="142" text-anchor="middle">Fase 1</text>
  <text x="160" y="160" text-anchor="middle" font-size="11">estructura</text>

  <rect x="40" y="210" width="240" height="54" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="160" y="232" text-anchor="middle">Fase 2</text>
  <text x="160" y="250" text-anchor="middle" font-size="11">protocolo</text>

  <rect x="40" y="300" width="240" height="54" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="160" y="322" text-anchor="middle">Fase 3</text>
  <text x="160" y="340" text-anchor="middle" font-size="11">dominio y partidas</text>

  <rect x="40" y="390" width="240" height="54" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="160" y="412" text-anchor="middle">Fase 4</text>
  <text x="160" y="430" text-anchor="middle" font-size="11">mensajes de juego</text>

  <rect x="40" y="480" width="240" height="54" rx="22" fill="#EDE9FE" stroke="#111827"/>
  <text x="160" y="502" text-anchor="middle">Fase 5</text>
  <text x="160" y="520" text-anchor="middle" font-size="11">rendimiento</text>

  <line x1="160" y1="84" x2="160" y2="120" stroke="#111827" marker-end="url(#a)"/>
  <text x="178" y="106" font-size="11">diagramas y reglas completas</text>

  <line x1="160" y1="174" x2="160" y2="210" stroke="#111827" marker-end="url(#a)"/>
  <text x="178" y="196" font-size="11">arnes en verde</text>

  <line x1="160" y1="264" x2="160" y2="300" stroke="#111827" marker-end="url(#a)"/>
  <text x="178" y="286" font-size="11">paridad de bytes y captura real</text>

  <line x1="160" y1="354" x2="160" y2="390" stroke="#111827" marker-end="url(#a)"/>
  <text x="178" y="376" font-size="11">perfil cargado de punta a punta</text>

  <line x1="160" y1="444" x2="160" y2="480" stroke="#111827" marker-end="url(#a)"/>
  <text x="178" y="466" font-size="11">flujo completo jugable</text>

  <path d="M740,210 h200 v40 a100,12 0 0 1 -200,0 z" fill="#E6F4EA" stroke="#111827"/>
  <ellipse cx="840" cy="210" rx="100" ry="12" fill="#E6F4EA" stroke="#111827"/>
  <text x="840" y="238" text-anchor="middle">Capturas del cliente</text>

  <path d="M740,300 h200 v40 a100,12 0 0 1 -200,0 z" fill="#E6F4EA" stroke="#111827"/>
  <ellipse cx="840" cy="300" rx="100" ry="12" fill="#E6F4EA" stroke="#111827"/>
  <text x="840" y="328" text-anchor="middle">Partidas de ejemplo</text>

  <path d="M740,390 h200 v40 a100,12 0 0 1 -200,0 z" fill="#E6F4EA" stroke="#111827"/>
  <ellipse cx="840" cy="390" rx="100" ry="12" fill="#E6F4EA" stroke="#111827"/>
  <text x="840" y="418" text-anchor="middle">Catálogo de objetos</text>

  <line x1="740" y1="237" x2="280" y2="237" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="510" y="230" text-anchor="middle" font-size="11">contrato de bytes</text>

  <line x1="740" y1="327" x2="280" y2="327" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="510" y="320" text-anchor="middle" font-size="11">casos reales</text>

  <line x1="740" y1="417" x2="280" y2="417" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="510" y="410" text-anchor="middle" font-size="11">precios y categorías</text>
