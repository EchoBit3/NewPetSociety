<svg xmlns="http://www.w3.org/2000/svg" width="940" height="230" viewBox="0 0 940 230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#111827">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="o" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#111827"/>
    </marker>
    <marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#FFFFFF" stroke="#111827"/>
    </marker>
  </defs>
  <rect width="940" height="230" fill="#FFFFFF"/>

  <rect x="30" y="40" width="140" height="50" rx="22" fill="#EDE9FE" stroke="#111827"/>
  <text x="100" y="118" text-anchor="middle">Inicio o fin</text>

  <rect x="200" y="40" width="140" height="50" rx="8" fill="#E8F0FE" stroke="#111827"/>
  <text x="270" y="118" text-anchor="middle">Acción o proceso</text>

  <polygon points="370,40 440,65 370,90 300,65" fill="#FFF4CC" stroke="#111827"/>
  <text x="370" y="118" text-anchor="middle">Decisión</text>

  <path d="M470,53 h140 v24 a70,12 0 0 1 -140,0 z" fill="#E6F4EA" stroke="#111827"/>
  <ellipse cx="540" cy="53" rx="70" ry="12" fill="#E6F4EA" stroke="#111827"/>
  <text x="540" y="118" text-anchor="middle">Dato almacenado</text>

  <rect x="640" y="40" width="140" height="50" rx="8" fill="#FCE7F3" stroke="#111827" stroke-dasharray="4 3"/>
  <text x="710" y="118" text-anchor="middle">Recurso opcional</text>

  <line x1="820" y1="65" x2="900" y2="65" stroke="#111827" marker-end="url(#a)"/>
  <text x="860" y="118" text-anchor="middle">Llamada</text>

  <line x1="60" y1="170" x2="140" y2="170" stroke="#111827" marker-end="url(#o)"/>
  <text x="100" y="208" text-anchor="middle">Uso o dependencia</text>

  <line x1="200" y1="170" x2="280" y2="170" stroke="#111827" stroke-dasharray="5 4" marker-end="url(#t)"/>
  <text x="240" y="208" text-anchor="middle">Realización</text>

  <line x1="300" y1="170" x2="440" y2="170" stroke="#111827"/>
  <polygon points="300,170 312,164 324,170 312,176" fill="#111827"/>
  <text x="370" y="208" text-anchor="middle">Composición</text>

  <line x1="470" y1="170" x2="610" y2="170" stroke="#111827"/>
  <text x="480" y="163" text-anchor="middle">1</text>
  <text x="600" y="163" text-anchor="middle">*</text>
  <text x="540" y="208" text-anchor="middle">Multiplicidad</text>

  <line x1="660" y1="140" x2="660" y2="200" stroke="#111827" stroke-dasharray="4 4"/>
  <rect x="656" y="160" width="8" height="30" fill="#FFFFFF" stroke="#111827"/>
  <text x="710" y="208" text-anchor="middle">Línea de vida y activación</text>

  <rect x="820" y="150" width="80" height="40" rx="6" fill="#E8F0FE" stroke="#111827"/>
  <text x="860" y="174" text-anchor="middle">«artifact»</text>
  <text x="860" y="208" text-anchor="middle">Artefacto</text>
</svg>
