<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#111827">
  <rect width="760" height="240" fill="#FFFFFF"/>
  <text x="60" y="46" font-size="12" fill="#374151">orden de red: primero el byte más significativo</text>

  <rect x="60" y="70" width="180" height="64" fill="#E8F0FE" stroke="#111827"/>
  <text x="150" y="96" text-anchor="middle">cero fijo</text>
  <text x="150" y="116" text-anchor="middle" font-size="11">uint8 · byte 0</text>

  <rect x="240" y="70" width="180" height="64" fill="#E8F0FE" stroke="#111827"/>
  <text x="330" y="96" text-anchor="middle">tipo repetido</text>
  <text x="330" y="116" text-anchor="middle" font-size="11">uint8 · byte 1</text>

  <rect x="420" y="70" width="300" height="64" fill="#FFF4CC" stroke="#111827"/>
  <text x="570" y="96" text-anchor="middle">contenido</text>
  <text x="570" y="116" text-anchor="middle" font-size="11">según el tipo · hasta el final</text>

  <path d="M420,148 V160 H720 V148" fill="none" stroke="#111827"/>
  <text x="570" y="178" text-anchor="middle" font-size="11">tamaño variable</text>

  <text x="60" y="210" font-size="11" fill="#374151">el tipo repetido permite reconocer la respuesta sin mirar la posición</text>
</svg>
